version: "3.9"

services:
  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - envs/infrastructure.env
  phoenix:
    image: arizephoenix/phoenix:latest
    depends_on:
      - db
    ports:
      - "6006:6006"  # UI and OTLP HTTP collector
      - "4317:4317"  # OTLP gRPC collector
    env_file:
      - envs/infrastructure.env

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: always
    depends_on:
      - db
      - phoenix
    env_file:
      - ./envs/.env.prod.ita
    environment:
      API_DATABASE_DOMAIN: db
      API_DATABASE_PORT: 5432
      API_DATABASE_SSL: disable
      API_PHOENIX_COLLECTOR_DOMAIN: phoenix
      API_PHOENIX_COLLECTOR_PORT: 4317
    ports:
      - "8000:8000"
  ui:
    image: localhost/rag_chatbot_ui:0.1.0
    restart: always
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      UI_API_DOMAIN: api
      UI_API_PORT: 8000
      UI_API_ENCRYPTION: False

volumes:
  db_data: