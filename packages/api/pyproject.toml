[project]
name = "api"
version = "0.1.0"
description = "FastAPI service that powers the rag chatbot"
authors = [{ name = "Valerio Conti", email = "conti.valerio@proton.me" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "core",
    "chatbot_orchestrator",
    "arize-phoenix>=13.15.0",
    "openinference-instrumentation-langchain>=0.1.61",
    "pydantic>=2.12.5",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.11",
    "langchain-anthropic>=1.4.0",
    "langchain-google-vertexai>=3.2.2",
    "pyjwt>=2.11.0",
    "pwdlib[argon2]>=0.3.0",
    "asyncpg>=0.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
core = { workspace = true }
chatbot_orchestrator = { workspace = true }
