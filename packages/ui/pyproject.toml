[project]
name = "ui"
version = "0.1.0"
description = "Streamlit UI to handle human-API interaction"
authors = [{ name = "Valerio Conti", email = "conti.valerio@proton.me" }]
dependencies = [
    "requests>=2.32.5",
    "streamlit>=1.55.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ui"]
