[project]
name = "document_loader"
version = "0.1.0"
description = "Loads documents inside of the target VectorDB"
authors = [{ name = "Valerio Conti", email = "conti.valerio@proton.me" }]
dependencies = [
    "core",
    "requests",
    "bs4",
    "urllib3",
    "langchain-community>=0.4.1",
    "pypdf>=6.6.2",
    "langchain-huggingface>=1.2.0",
    "langchain>=1.2.8",
    "langchain-text-splitters>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loader"]

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "requests-mock>=1.12.1",
]
