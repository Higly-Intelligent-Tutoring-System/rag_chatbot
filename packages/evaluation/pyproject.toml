[project]
name = "evaluation"
version = "0.1.0"
description = "Evaluation package designed to evaluate the chatbot responses automatically"
authors = [{ name = "Valerio Conti", email = "conti.valerio@proton.me" }]
dependencies = [
    "core",
    "chatbot_orchestrator",
    "ragas>=0.4.3",
    "openai>=1.0.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]

[tool.uv.sources]
core = { workspace = true }
chatbot_orchestrator = { workspace = true }
