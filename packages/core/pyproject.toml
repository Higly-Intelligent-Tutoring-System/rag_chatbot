[project]
name = "core"
version = "0.1.0"
description = "Core package containing all the shared components of the repository"
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "sentence-transformers>=5.2.2",
    "supabase>=2.27.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
