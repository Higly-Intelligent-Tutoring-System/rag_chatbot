[project]
name = "chatbot_orchestrator"
version = "0.1.0"
description = "RAG orchestration layer for the HITS Chatbot."
authors = [{ name = "HITS Project Team" }]
requires-python = ">=3.13"
dependencies = [
    "core",
    "langgraph>=1.0.7",
    "langgraph-checkpoint>=4.0.0",
    "langgraph-checkpoint-postgres>=3.0.4",
    "psycopg[binary,pool]>=3.3.3",
    "uuid>=1.30",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
core = { workspace = true }
