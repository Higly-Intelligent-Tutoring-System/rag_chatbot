name: Deploy on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: app_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          
          PROJECT_PATH="/home/peasant/rag_chatbot"
          ENVS_PATH="$PROJECT_PATH/envs"
          RCLONE_PATH="$PROJECT_PATH/rclone"
          
          # Use the app token for git operations
          # Delete and clone fresh with the app token
          rm -rf "$PROJECT_PATH"
          git clone https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/Higly-Intelligent-Tutoring-System/rag_chatbot.git "$PROJECT_PATH"
          cd "$PROJECT_PATH"
          
          # Write env files
          cat > "$ENVS_PATH/.env.prod.ita" << 'ENVFILE'
          ${{ secrets.ENV_ITA }}
          ENVFILE

          cat > "$ENVS_PATH/.env.prod.slo" << 'ENVFILE'
          ${{ secrets.ENV_SLO }}
          ENVFILE

          cat > "$ENVS_PATH/.env.prod.esp" << 'ENVFILE'
          ${{ secrets.ENV_ESP }}
          ENVFILE

          cat > "$ENVS_PATH/.env.prod.rou" << 'ENVFILE'
          ${{ secrets.ENV_ROU }}
          ENVFILE

          cat > "$ENVS_PATH/.env.prod.ltu" << 'ENVFILE'
          ${{ secrets.ENV_LTU }}
          ENVFILE

          cat > "$ENVS_PATH/postgres.env" << 'ENVFILE'
          ${{ secrets.ENV_POSTGRES }}
          ENVFILE
          
          cat > "$ENVS_PATH/phoenix.env" << 'ENVFILE'
          ${{ secrets.ENV_PHOENIX }}
          ENVFILE

          cat > "$ENVS_PATH/caddy.env" << 'ENVFILE'
          ${{ secrets.ENV_CADDY }}
          ENVFILE

          cat > "$ENVS_PATH/pg_backup.env" << 'ENVFILE'
          ${{ secrets.ENV_PG_BACKUP }}
          ENVFILE

          # Writing the users.json file
          cat > "$PROJECT_PATH/users.json" << 'USERS_EOF'
          ${{ secrets.CHATBOT_USERS }}
          USERS_EOF

          # Write rclone config
          cat > "$RCLONE_PATH/rclone.conf" << 'RCLONE_EOF'
          ${{ secrets.RCLONE_DROPBOX }}
          RCLONE_EOF
          
          # Sync dependencies
          uv sync --all-packages
          
          # Deploy
          docker compose -f docker-compose.prod.yml down || true
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d

          # Execute the user tool
          (export $(cat envs/.env.prod.ita | xargs) && uv run python -m api.tools.add_users --database-url "${{ secrets.DB_URI_USER_TOOL }}" --users-file "./users.json")
          
          echo "Deployment completed!"
          EOF
