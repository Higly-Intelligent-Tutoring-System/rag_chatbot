x-api-base: &api_base
  image: rag_chatbot_api:latest
  build:
    context: .
    dockerfile: docker/Dockerfile.api
    tags:
    - rag_chatbot_api:latest
  restart: always
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/liveness"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  depends_on:
    db:
      condition: service_healthy
    phoenix:
      condition: service_started
  environment:
    API_DATABASE_DOMAIN: db
    API_DATABASE_PORT: 5432
    API_DATABASE_SSL: disable
    API_PHOENIX_COLLECTOR_DOMAIN: phoenix
    API_PHOENIX_COLLECTOR_PORT: 4317
    LANGGRAPH_STRICT_MSGPACK: true
  expose:
    - "8000"
  networks:
    - business_net
    - edge_net

services:
  db:
    image: docker.io/library/postgres:17
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    env_file:
      - envs/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backup_net
      - business_net
  db-backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    restart: "no"
    env_file:
      - envs/pg_backup.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./rclone:/config/rclone:rw
    networks:
      - backup_net
  phoenix:
    image: docker.io/arizephoenix/phoenix:20.8
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "6006"  # UI and OTLP HTTP collector
      - "4317"  # OTLP gRPC collector
    env_file:
      - envs/phoenix.env
    networks:
      - business_net
      - edge_net
  api:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.ita
  api2:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.slo
  api3:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.esp
  api4:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.rou
  api5:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.ltu

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
      tags:
      - rag_chatbot_ui:latest
    restart: always
    depends_on:
      api:
        condition: service_started
      api2:
        condition: service_started
      api3:
        condition: service_started
      api4:
        condition: service_started
      api5:
        condition: service_started        
    expose:
      - "8501"
    environment:
      UI_API_DOMAIN: hits-chatbot.duckdns.org
      UI_API_PORT: 443
      UI_API_AUTH: True
      UI_API_OVER_TLS: True
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - edge_net
  caddy:
    build:
      context: .
      dockerfile: docker/Dockerfile.caddy
      tags:
      - rag_chatbot_caddy:latest
    ports: 
      - "80:80"
      - "443:443"
    env_file:
      - envs/caddy.env
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge_net
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:2.5.3
    container_name: uptime-kuma
    restart: always
    volumes:
      - uptime-kuma_data:/app/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/entry/bookmark"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - db
      - phoenix
      - api
      - ui
      - caddy
    networks:
      - edge_net
      - business_net
      - backup_net
    environment:
      UPTIME_KUMA_PORT: "3001"

networks:
  backup_net:
  business_net:
  edge_net:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
  uptime-kuma_data: