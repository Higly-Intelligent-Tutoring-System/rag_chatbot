version: "3.9"

x-api-base: &api_base
  image: rag_chatbot_api:latest
  build:
    context: .
    dockerfile: docker/Dockerfile.api
    tags:
    - rag_chatbot_api:latest
  restart: always
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/liveness"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  depends_on:
    db:
      condition: service_healthy
    phoenix:
      condition: service_started
  environment:
    API_DATABASE_DOMAIN: db
    API_DATABASE_PORT: 5432
    API_DATABASE_SSL: disable
    API_PHOENIX_COLLECTOR_DOMAIN: phoenix
    API_PHOENIX_COLLECTOR_PORT: 4317
    LANGGRAPH_STRICT_MSGPACK: true
  expose:
    - "8000"
  networks:
    - caddy_net

services:
  db:
    image: docker.io/library/postgres:17
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    env_file:
      - envs/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backup_net
  db-backup:
    build: .
    image: docker/Dockerfile.backup
    restart: "no"
    env_file:
      - envs/pg_backup.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./rclone:/config/rclone:ro
    networks:
      - backup_net
  phoenix:
    image: arizephoenix/phoenix:latest
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "6006"  # UI and OTLP HTTP collector
      - "4317"  # OTLP gRPC collector
    env_file:
      - envs/phoenix.env
  api:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.ita
  api2:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.slo
  api3:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.esp
  api4:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.rou
  api5:
    <<: *api_base
    env_file:
      - ./envs/.env.prod.ltu

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
      tags:
      - rag_chatbot_ui:latest
    restart: always
    depends_on:
      api:
        condition: service_started
      api2:
        condition: service_started
      api3:
        condition: service_started
      api4:
        condition: service_started
      api5:
        condition: service_started        
    expose:
      - "8501"
    environment:
      UI_API_DOMAIN: hits-chatbot.duckdns.org
      UI_API_PORT: 8080
      UI_API_ENCRYPTION: True
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - caddy_net
  caddy:
    build:
      context: .
      dockerfile: docker/Dockerfile.caddy
      tags:
      - rag_chatbot_caddy:latest
    ports: 
      - "80:80"
      - "443:443"
    env_file:
      - envs/caddy.env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile.prod
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_net

networks:
  backup_net:
  caddy_net:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config: