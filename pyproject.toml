[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Monorepositoy containing both the RAG pipeline to transform documents into embeddings and the API backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "langchain>=1.2.8",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:ldap3.*",
  "ignore::DeprecationWarning:phoenix.*",
  "ignore::DeprecationWarning:strawberry.*",
  "ignore::pyparsing.exceptions.PyparsingDeprecationWarning",
  "ignore::pydantic.warnings.PydanticDeprecatedSince212:pyiceberg.*",
  "ignore::pydantic.warnings.PydanticDeprecatedSince20:pydantic.*",
]
